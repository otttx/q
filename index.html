<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d7a68">
<title>مِران | منصة التطبيقات العملية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d7a68'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='Tahoma'%3E%D9%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#f7f9fa; --line:#e1e7ec; --line2:#cfd8df;
  --text:#132029; --muted:#5d6c78; --faint:#8a97a2;
  --pri:#0d7a68; --pri-h:#0a6556; --pri-ink:#ffffff; --pri-soft:#e1f2ee; --pri-line:#a9dccf;
  --danger:#c0392b; --danger-soft:#fdecea; --warn:#9a5b00; --warn-soft:#fff2dc; --ok:#1c7d45; --ok-soft:#e5f4ea; --info:#2c5cad; --info-soft:#e7eefa;
  --r:14px; --r-sm:10px; --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1216; --surface:#151d23; --surface2:#1a242b; --line:#26323b; --line2:#33424d;
    --text:#e5ebf0; --muted:#9aa8b3; --faint:#73818c;
    --pri:#35b59d; --pri-h:#48c4ad; --pri-ink:#04201b; --pri-soft:#10342e; --pri-line:#1e5a4e;
    --danger:#ee7366; --danger-soft:#3b1f1c; --warn:#f0a845; --warn-soft:#3a2b14; --ok:#52c48c; --ok-soft:#143222; --info:#7ea9f2; --info-soft:#17263e;
    --sh:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3{line-height:1.4;margin:0 0 .5em}
h1{font-size:1.5rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:.4em 0}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1120px}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center}
.mt{margin-top:12px} .mt2{margin-top:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card + .card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{background:var(--pri-h)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.soft-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn.lg{min-height:54px;font-size:1.05rem}
.btn.block{width:100%}
.btn.link{border:0;background:none;padding:2px 4px;min-height:0;color:var(--pri);text-decoration:underline}
.field{display:block;margin-top:12px}
.field > span{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.input,.textarea,.select{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.textarea{min-height:110px;resize:vertical;line-height:1.8}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:4px;accent-color:var(--pri);flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.pri{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.live-dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.notice{border-radius:var(--r-sm);padding:12px 14px;background:var(--info-soft);border:1px solid transparent}
.notice.warn{background:var(--warn-soft)} .notice.danger{background:var(--danger-soft)} .notice.ok{background:var(--ok-soft)}
.notice ul{margin:6px 0 0;padding-inline-start:20px}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.86rem;padding:6px 16px;text-align:center;font-weight:600}
.demo-bar .btn{min-height:28px;padding:0 10px;font-size:.8rem;margin-inline-start:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700;font-size:1.35rem;flex:none}
.brand b{font-size:1.2rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.8rem}
.hero{padding:30px 0 6px;text-align:center}
.hero .logo{width:66px;height:66px;font-size:2.1rem;border-radius:20px;margin:0 auto 10px}
.hero h1{font-size:1.9rem;margin:0}
.pin-input{width:100%;max-width:340px;display:block;margin:12px auto 0;text-align:center;font-size:2.1rem;letter-spacing:.35em;padding:10px 0 10px .35em;font-weight:700;border:2px solid var(--line2);border-radius:16px;background:var(--surface);outline:none;font-variant-numeric:tabular-nums;direction:ltr}
.pin-input:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.pin-err{color:var(--danger);text-align:center;min-height:1.7em;margin-top:6px;font-weight:600}
.foot{text-align:center;color:var(--faint);font-size:.8rem;padding:26px 0 18px}
.foot .btn{color:var(--muted)}
.mine{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;margin-top:8px}
.name-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);margin-top:8px}
.name-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;min-height:48px}
.name-item:last-child{border-bottom:0}
.name-item.sel{background:var(--pri-soft);color:var(--pri);font-weight:700}
.name-item[disabled]{color:var(--faint);cursor:not-allowed;background:var(--surface2)}
.qtop{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(4px)){.qtop{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}}
.qtop-in{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;max-width:760px;margin:0 auto}
.qtop-title{font-weight:700;font-size:.95rem;line-height:1.4}
.qtop-name{font-size:.8rem;color:var(--muted)}
.qtop-side{display:flex;align-items:center;gap:8px;flex:none}
.timer{font-weight:700;font-variant-numeric:tabular-nums;background:var(--pri-soft);color:var(--pri);padding:2px 10px;border-radius:999px;direction:ltr}
.timer.low{background:var(--danger-soft);color:var(--danger)}
.prog{font-weight:700;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.save-st{font-size:.74rem;color:var(--faint);text-align:center}
.save-st.err{color:var(--danger);font-weight:700}
.progbar{height:4px;background:var(--line)} .progbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--sh)}
.q-card.done{border-color:var(--pri-line)}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q-num{width:30px;height:30px;border-radius:9px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.q-type{font-size:.8rem;color:var(--muted);font-weight:600}
.q-text{font-weight:600;font-size:1.02rem;line-height:1.85}
.ns{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;min-height:50px;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:500;line-height:1.6}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);flex:none;position:relative}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .dot{border-color:var(--pri)}
.opt.sel .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--pri)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mrow{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.mtext{font-weight:500;margin-bottom:8px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-size:.9rem;font-weight:500}
.mchip.sel{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.ans{margin-top:10px}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.submit-zone{margin:22px 0 40px}
.wm{position:fixed;inset:0;pointer-events:none;z-index:15;background-repeat:repeat}
.away-ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(10,15,20,.55)}
.away-ov > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);max-width:360px}
body.away .away-ov{display:flex}
body.away #quizBody{filter:blur(12px)}
.flash{position:fixed;inset:0;z-index:60;background:#000;opacity:.94;pointer-events:none}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:2rem;margin:0 auto 8px}
.score-big{margin:14px auto 4px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.score-big b{font-size:3rem;line-height:1;color:var(--pri);font-variant-numeric:tabular-nums}
.score-big span{color:var(--muted);font-weight:600}
.rv{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:10px;background:var(--surface)}
.rv-q{font-weight:600}
.rv-a{margin-top:6px;font-size:.93rem}
.ok-t{color:var(--ok);font-weight:700} .bad-t{color:var(--danger);font-weight:700}
.atop{background:var(--surface);border-bottom:1px solid var(--line)}
.atop .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar h2{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.grid2 .card + .card{margin-top:0}
.qc-title{font-weight:700;font-size:1.05rem;line-height:1.5}
.qc-meta{color:var(--muted);font-size:.86rem;margin-top:2px}
.pin-t{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.12em;direction:ltr;display:inline-block}
.qc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.plat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switch-row:first-child{border-top:0}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:999px;background:var(--line2);border:0;cursor:pointer;transition:background .2s;padding:0}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--pri)}
.sw.on::after{right:25px}
.mon-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.pinbox{text-align:center;background:var(--pri-soft);border-radius:var(--r);padding:10px 18px}
.pinbox small{display:block;color:var(--muted);font-weight:600}
.pinbox b{font-size:2rem;letter-spacing:.14em;direction:ltr;display:block;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.list-card{padding:0;overflow:hidden}
.att{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center;width:100%;text-align:start;background:var(--surface)}
.att:hover{background:var(--surface2)}
.att:last-child{border-bottom:0}
.att-name{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.att-meta{color:var(--muted);font-size:.82rem}
.att-score{font-weight:700;font-size:1.1rem;text-align:center;min-width:64px;grid-row:1 / span 2;grid-column:2;font-variant-numeric:tabular-nums}
.flags{display:flex;gap:6px;flex-wrap:wrap;grid-column:1 / -1}
.risk{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.risk.mid{background:var(--warn)} .risk.high{background:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.timeline{list-style:none;padding:0;margin:8px 0 0;font-size:.86rem;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.timeline li{padding:6px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.timeline li:last-child{border-bottom:0}
.timeline time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;direction:ltr}
.code{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;white-space:pre;overflow:auto;max-height:280px;margin:8px 0 0}
.steps{padding-inline-start:22px;margin:6px 0}
.steps li{margin-bottom:6px}
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(10,15,20,.5);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:880px}
@media (min-width:700px){.modal-back{align-items:center;padding:20px}.modal{border-radius:18px}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);z-index:130;background:#1c2730;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;font-size:.93rem;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.danger{background:#b3362a} .toast.warn{background:#8f5500} .toast.ok{background:#1c7d45}
.busy-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:140;background:linear-gradient(90deg,transparent,var(--pri),transparent);background-size:50% 100%;animation:busy 1s linear infinite;display:none}
body.busy .busy-bar{display:block}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{min-height:60vh;display:grid;place-items:center}
.proj{position:fixed;inset:0;z-index:90;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:8px;overflow:auto}
.proj-x{position:absolute;top:14px;left:14px}
.proj-title{font-size:clamp(1.2rem,3vw,2.1rem);font-weight:700}
.proj-grid{display:flex;gap:44px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px}
.proj-qr{background:#fff;padding:14px;border-radius:16px;border:1px solid var(--line);min-width:120px;min-height:120px;display:grid;place-items:center}
.proj-qr img,.proj-qr canvas{display:block}
.proj-steps{font-size:clamp(1rem,2.1vw,1.45rem);text-align:start;line-height:2}
.proj-pin{font-size:clamp(3rem,9vw,6.5rem);font-weight:700;letter-spacing:.1em;color:var(--pri);line-height:1.1;direction:ltr;font-variant-numeric:tabular-nums}
.proj-link{color:var(--muted);direction:ltr;font-size:.85rem;word-break:break-all;max-width:90vw}
#print-root{display:none}
body.printing #app,body.printing #modal-root,body.printing #toast{display:none !important}
body.printing #print-root{display:block}
body.printing{background:#e9edf0}
.rp-tool{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 16px;display:flex;gap:8px;justify-content:center;z-index:5;color:#111}
.rp-tool .btn{background:#fff;color:#111;border-color:#ccc}
.rp-tool .btn.pri{background:#0d7a68;color:#fff;border-color:#0d7a68}
.rp{background:#fff;color:#111;max-width:820px;margin:16px auto;padding:28px 32px;border-radius:8px;font-size:14px;line-height:1.8}
.rp h1{font-size:20px;margin:4px 0} .rp h2{font-size:16px;margin:22px 0 8px;border-bottom:2px solid #0d7a68;padding-bottom:4px}
.rp-brand{color:#0d7a68;font-weight:700;font-size:13px}
.rp-meta{color:#444;font-size:13px}
.rp-stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0;font-size:13px;color:#333}
.rp table{width:100%;border-collapse:collapse;margin-top:6px}
.rp th,.rp td{border:1px solid #cfd6db;padding:5px 8px;text-align:right;vertical-align:top}
.rp th{background:#eef5f3}
.rp tr{break-inside:avoid}
.rp .num{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.rp .rq{break-inside:avoid;border:1px solid #dfe4e8;border-radius:6px;padding:8px 10px;margin-top:8px}
.rp .rq-q{font-weight:700}
.rp .rq-ok{color:#1c7d45;font-weight:700}
.rp .rq-ex{color:#555;font-size:13px}
.rp-foot{margin-top:22px;color:#777;font-size:12px;text-align:center}
@media print{

<script type="module">
/* =========================================================
   مِران — منصة التطبيقات العملية
   تطوير: د. عبدالله القويفلي
   ملف واحد: صفحة الطالب + لوحة الأستاذ (#admin)
   ========================================================= */

/* ---------- إعدادات عامة ---------- */
const APP = { name: 'مِران', tagline: 'منصة التطبيقات العملية', dev: 'د. عبدالله القويفلي' };
const FB_VER = '10.12.2';
const P = 'mrn_';            // بادئة مجموعات قاعدة البيانات
const PIN_LEN = 5;           // عدد أرقام رمز الدخول
const BULK_LIMIT = 25;       // أقصى عدد أحرف يُقبل إدخالها دفعة واحدة
const GRACE_SEC = 90;        // مهلة حفظ الإجابات بعد إغلاق النموذج
// اختياري: لمن يريد وضع إعدادات فايربيز داخل الملف بدل لصقها في لوحة التحكم:
// const DEFAULT_CONFIG = { apiKey: '...', projectId: '...' };
const DEFAULT_CONFIG = null;

const SERVER_TS = { __mrn: 'ts' };
const DEL = { __mrn: 'del' };

/* ---------- أدوات ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
const toMs = v => !v ? null : typeof v === 'number' ? v : v.toMillis ? v.toMillis() : (v.seconds != null ? v.seconds * 1000 : null);
const toLatin = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const normName = s => String(s || '').replace(/[ً-ْٰـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, ' ').trim();
const nameKey = s => normName(s).replace(/[\/.#\[\]*`~$]/g, '_').slice(0, 140) || 'x';
const round4 = x => Math.round(x * 4) / 4;
const fmtNum = x => { const v = Math.round(Number(x) * 100) / 100; return Number.isFinite(v) ? String(v) : '—'; };
const secs = ms => { const s = Math.round((ms || 0) / 1000); if (s < 60) return s + ' ث'; const m = Math.floor(s / 60); return m + ' د' + (s % 60 ? ' ' + (s % 60) + ' ث' : ''); };
const clock = ms => ms ? new Date(ms).toLocaleTimeString('ar-SA-u-nu-latn', { hour: 'numeric', minute: '2-digit' }) : '—';
const clockS = ms => ms ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
const dayHijri = ms => { try { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(ms)); } catch (e) { return new Date(ms).toLocaleDateString(); } };
const dayGreg = ms => new Date(ms).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' });
const coll = new Intl.Collator('ar');
const sortByCreated = arr => arr.sort((a, b) => (toMs(b.createdAt) || 0) - (toMs(a.createdAt) || 0));
const E = code => Object.assign(new Error(code), { code });
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

function parseHash() {
  const o = {};
  location.hash.replace(/^#/, '').split('&').filter(Boolean).forEach(p => {
    const i = p.indexOf('=');
    if (i < 0) o[decodeURIComponent(p)] = true;
    else o[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1));
  });
  return o;
}
function parseConfigText(t) {
  const g = k => { const m = String(t || '').match(new RegExp('["\']?' + k + '["\']?\\s*:\\s*["\']([^"\']+)["\']')); return m ? m[1].trim() : ''; };
  const c = { apiKey: g('apiKey'), projectId: g('projectId'), authDomain: g('authDomain'), appId: g('appId') };
  return c.apiKey && c.projectId ? c : null;
}
const encodeCfg = c => [c.projectId, c.apiKey].concat(c.authDomain && c.authDomain !== c.projectId + '.firebaseapp.com' ? [c.authDomain] : []).join('~');
function decodeCfg(s) {
  const p = String(s || '').split('~');
  if (p.length < 2 || !/^[a-z0-9-]+$/.test(p[0]) || !/^[A-Za-z0-9_-]{20,}$/.test(p[1])) return null;
  return { projectId: p[0], apiKey: p[1], authDomain: p[2] || '' };
}
let RUNTIME_CFG = null;
const readCfg = () => DEFAULT_CONFIG || RUNTIME_CFG || lsGet('mrn_cfg');

let toastT;
function toast(msg, kind = 'info', ms = 2800) {
  const t = $('#toast'); t.className = 'toast show ' + kind; t.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, ms);
}
async function busy(fn) {
  document.body.classList.add('busy');
  try { return await fn(); }
  catch (e) { console.error(e); toast(errMsg(e), 'danger', 6000); }
  finally { document.body.classList.remove('busy'); }
}
function errMsg(e) {
  const c = String(e?.code || '') + ' ' + String(e?.message || '');
  if (/name-taken/.test(c)) return 'هذا الاسم دخل النموذج من قبل. إن كان اسمك فاطلب من الأستاذ إعادة السماح لك.';
  if (/quiz-closed/.test(c)) return 'هذا النموذج مغلق.';
  if (/permission-denied|insufficient permissions/i.test(c)) return S.mode === 'demo' ? 'غير مسموح: النموذج مغلق أو سُلّمت الإجابات.' : 'لا توجد صلاحية. تأكد من نشر قواعد الأمان (Rules) وأن بريد الأستاذ مكتوب فيها، وأن النموذج مفتوح.';
  if (/operation-not-allowed|admin-restricted/i.test(c)) return 'طريقة الدخول غير مفعّلة. فعّل Email/Password و Anonymous في Firebase Authentication.';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/i.test(c)) return 'البريد أو كلمة المرور غير صحيحة.';
  if (/too-many-requests/i.test(c)) return 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.';
  if (/api-key-not-valid|invalid-api-key/i.test(c)) return 'إعدادات فايربيز غير صحيحة (apiKey).';
  if (/unavailable|network|offline|Failed to fetch|failed to fetch/i.test(c)) return 'تعذر الاتصال. تحقق من الإنترنت ثم أعد المحاولة.';
  if (/not-found|NOT_FOUND/.test(c)) return 'قاعدة البيانات غير موجودة. أنشئ Firestore Database في مشروع فايربيز.';
  return 'حدث خطأ: ' + (e?.message || e?.code || 'غير معروف');
}

/* ---------- نوافذ ---------- */
function modal(html, opts = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-back"><div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const back = root.firstElementChild;
  back.addEventListener('click', e => { if (e.target === back && !opts.sticky) closeModal(); });
  modal.onClose = opts.onClose || null;
  const m = back.firstElementChild;
  m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal()));
  return m;
}
function closeModal() { const f = modal.onClose; modal.onClose = null; $('#modal-root').innerHTML = ''; if (f) f(); }
function confirmBox(title, bodyHtml, okText = 'تأكيد', danger = false) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3><div class="muted">${bodyHtml}</div><div class="actions"><button class="btn ghost" data-no>إلغاء</button><button class="btn ${danger ? 'danger' : 'pri'}" data-yes>${esc(okText)}</button></div>`, { onClose: () => res(false) });
    m.querySelector('[data-no]').onclick = () => closeModal();
    m.querySelector('[data-yes]').onclick = () => { modal.onClose = null; closeModal(); res(true); };
  });
}
function loadScript(src, globalName) {
  return new Promise((res, rej) => {
    if (globalName && window[globalName]) return res();
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => rej(new Error('تعذر تحميل ' + src));
    document.head.appendChild(s);
  });
}
async function renderQR(el, text, size) {
  if (!el) return;
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'QRCode');
    el.innerHTML = '';
    new window.QRCode(el, { text, width: size, height: size, colorDark: '#000000', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.M });
  } catch (e) { el.innerHTML = '<div class="muted small">تعذر إنشاء رمز QR، استعمل الرابط.</div>'; }
}
function download(content, filename, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('نُسخ', 'ok'); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('نُسخ', 'ok'); } catch (_) { toast('انسخ يدوياً', 'warn'); } t.remove(); }
}

/* =========================================================
   طبقة البيانات: وضع تجريبي (في المتصفح) + فايربيز
   ========================================================= */
class MockDB {
  constructor() {
    this.k = 'mrn_demo_db'; this.subs = new Set();
    let u = sessionStorage.getItem('mrn_demo_uid'); if (!u) { u = 'u' + rid(10); sessionStorage.setItem('mrn_demo_uid', u); }
    this.uid = u;
    addEventListener('storage', e => { if (e.key === this.k) this._emit(); });
  }
  _blank() { return { groups: {}, quizzes: {}, keys: {}, attempts: {}, taken: {}, settings: { global: { open: true } } }; }
  _load() { try { return Object.assign(this._blank(), JSON.parse(localStorage.getItem(this.k) || '{}')); } catch (e) { return this._blank(); } }
  _save(d) { localStorage.setItem(this.k, JSON.stringify(d)); this._emit(); }
  _emit() { for (const f of [...this.subs]) { try { f(); } catch (e) { console.error(e); } } }
  _sub(fn) { const w = () => fn(); this.subs.add(w); setTimeout(w, 0); return () => this.subs.delete(w); }
  _tx(fn) { const run = () => { const d = this._load(); const r = fn(d); this._save(d); return r; }; return navigator.locks?.request ? navigator.locks.request('mrn_demo_db', run) : Promise.resolve().then(run); }
  _apply(o, p) { for (const [k, v] of Object.entries(p)) { if (v === SERVER_TS) o[k] = Date.now(); else if (v === DEL) delete o[k]; else o[k] = clone(v); } return o; }
  onTeacher(cb) { this._tcb = cb; const e = sessionStorage.getItem('mrn_demo_t'); setTimeout(() => cb(e ? { email: e } : null), 0); return () => { this._tcb = null; }; }
  async teacherLogin(email) { const e = String(email || '').trim() || 'demo@teacher'; sessionStorage.setItem('mrn_demo_t', e); this._tcb && this._tcb({ email: e }); }
  async teacherLogout() { sessionStorage.removeItem('mrn_demo_t'); this._tcb && this._tcb(null); }
  async ensureStudent() { return this.uid; }
  watchSettings(cb) { return this._sub(() => cb(this._load().settings.global || { open: true })); }
  async getSettings() { return this._load().settings.global || { open: true }; }
  async setSettings(p) { return this._tx(d => { d.settings.global = this._apply(d.settings.global || { open: true }, p); }); }
  watchGroups(cb) { return this._sub(() => cb(sortByCreated(Object.values(this._load().groups)))); }
  async saveGroup(g) { return this._tx(d => { const id = g.id || ('g' + rid(8)); const { id: _x, ...rest } = g; d.groups[id] = this._apply(d.groups[id] || { id, createdAt: Date.now() }, { ...rest, updatedAt: SERVER_TS }); return id; }); }
  async updateGroup(id, p) { return this._tx(d => { if (d.groups[id]) this._apply(d.groups[id], p); }); }
  async deleteGroup(id) { return this._tx(d => { delete d.groups[id]; }); }
  watchQuizzes(cb) { return this._sub(() => cb(sortByCreated(Object.values(this._load().quizzes)))); }
  watchQuiz(id, cb) { return this._sub(() => cb(clone(this._load().quizzes[id] || null))); }
  async getQuiz(id) { return clone(this._load().quizzes[id] || null); }
  async createQuiz(pub, key) { return this._tx(d => { const id = 'q' + rid(10); d.quizzes[id] = this._apply({ id }, { ...pub, createdAt: SERVER_TS }); d.keys[id] = { key: clone(key) }; return id; }); }
  async updateQuiz(id, p) { return this._tx(d => { if (!d.quizzes[id]) throw E('not-found'); this._apply(d.quizzes[id], p); }); }
  async deleteQuiz(id) { return this._tx(d => { delete d.quizzes[id]; delete d.keys[id]; for (const k of Object.keys(d.attempts)) if (k.startsWith(id + '/')) delete d.attempts[k]; for (const k of Object.keys(d.taken)) if (k.startsWith(id + '/')) delete d.taken[k]; }); }
  async getKey(id) { return clone(this._load().keys[id]?.key || null); }
  async setKey(id, key) { return this._tx(d => { d.keys[id] = { key: clone(key) }; }); }
  async findOpenQuizByPin(pin) { return clone(Object.values(this._load().quizzes).find(q => q.pin === pin && q.status === 'open') || null); }
  watchAttempts(qid, cb) { return this._sub(() => { const d = this._load(); cb(Object.entries(d.attempts).filter(([k]) => k.startsWith(qid + '/')).map(([k, v]) => ({ ...clone(v), id: k.slice(qid.length + 1) }))); }); }
  watchAttempt(qid, uid, cb) { return this._sub(() => { const a = this._load().attempts[qid + '/' + uid]; cb(a ? { ...clone(a), id: uid } : null); }); }
  async getAttempt(qid, uid) { const a = this._load().attempts[qid + '/' + uid]; return a ? { ...clone(a), id: uid } : null; }
  async isTaken(qid, nk) { return !!this._load().taken[qid + '/' + nk]; }
  watchTaken(qid, cb) { return this._sub(() => { const d = this._load(); cb(Object.entries(d.taken).filter(([k]) => k.startsWith(qid + '/')).map(([, v]) => v)); }); }
  async startAttempt(qid, uid, data, nk) {
    return this._tx(d => {
    const q = d.quizzes[qid]; const s = d.settings.global || {};
    if (!q || q.status !== 'open' || q.courseClosed || s.open === false) throw E('permission-denied');
    if (d.taken[qid + '/' + nk]) throw E('name-taken');
    if (d.attempts[qid + '/' + uid]) throw E('permission-denied');
    d.taken[qid + '/' + nk] = { name: data.name, uid, at: Date.now() };
    d.attempts[qid + '/' + uid] = this._apply({}, { ...data, uid, status: 'in_progress', startedAt: SERVER_TS });
    });
  }
  async saveAttempt(qid, uid, p) {
    return this._tx(d => {
    const a = d.attempts[qid + '/' + uid]; const q = d.quizzes[qid];
    if (!a || !q || a.status !== 'in_progress') throw E('permission-denied');
    const ok = q.status === 'open' || (q.status === 'closed' && q.closedAt && Date.now() < q.closedAt + GRACE_SEC * 1000);
    if (!ok) throw E('permission-denied');
    this._apply(a, p);
    });
  }
  async teacherUpdateAttempt(qid, uid, p) { return this._tx(d => { const a = d.attempts[qid + '/' + uid]; if (a) this._apply(a, p); }); }
  async resetAttempt(qid, uid, nk) { return this._tx(d => { delete d.attempts[qid + '/' + uid]; if (nk) delete d.taken[qid + '/' + nk]; }); }
}

class FireDB {
  async init(cfg) {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [A, U, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    this.U = U; this.F = F;
    const conf = { apiKey: cfg.apiKey, authDomain: cfg.authDomain || `${cfg.projectId}.firebaseapp.com`, projectId: cfg.projectId };
    if (cfg.appId) conf.appId = cfg.appId;
    this.app = A.initializeApp(conf);
    this.auth = U.getAuth(this.app);
    this.db = F.initializeFirestore(this.app, { ignoreUndefinedProperties: true });
    if (this.auth.authStateReady) await this.auth.authStateReady();
  }
  _v(p) { const o = {}; for (const [k, v] of Object.entries(p)) o[k] = v === SERVER_TS ? this.F.serverTimestamp() : v === DEL ? this.F.deleteField() : (v === undefined ? null : v); return o; }
  _dt(d) { return { id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }; }
  _d(s) { return s.exists() ? this._dt(s) : null; }
  col(...p) { return this.F.collection(this.db, ...p); }
  ref(...p) { return this.F.doc(this.db, ...p); }
  onTeacher(cb) { return this.U.onAuthStateChanged(this.auth, u => cb(u && !u.isAnonymous && u.email ? { email: u.email } : null)); }
  async teacherLogin(email, pass) { await this.U.signInWithEmailAndPassword(this.auth, String(email).trim(), pass); }
  async teacherLogout() { await this.U.signOut(this.auth); }
  async ensureStudent() { if (this.auth.currentUser) return this.auth.currentUser.uid; const c = await this.U.signInAnonymously(this.auth); return c.user.uid; }
  watchSettings(cb, er) { return this.F.onSnapshot(this.ref(P + 'settings', 'global'), s => cb(s.exists() ? s.data() : { open: true }), er); }
  async getSettings() { const s = await this.F.getDoc(this.ref(P + 'settings', 'global')); return s.exists() ? s.data() : { open: true }; }
  async setSettings(p) { await this.F.setDoc(this.ref(P + 'settings', 'global'), this._v(p), { merge: true }); }
  watchGroups(cb, er) { return this.F.onSnapshot(this.col(P + 'groups'), s => cb(sortByCreated(s.docs.map(d => this._dt(d)))), er); }
  async saveGroup(g) { const { id, ...rest } = g; if (id) { await this.F.setDoc(this.ref(P + 'groups', id), this._v({ ...rest, updatedAt: SERVER_TS }), { merge: true }); return id; } const r = await this.F.addDoc(this.col(P + 'groups'), this._v({ ...rest, createdAt: SERVER_TS, updatedAt: SERVER_TS })); return r.id; }
  async updateGroup(id, p) { await this.F.updateDoc(this.ref(P + 'groups', id), this._v(p)); }
  async deleteGroup(id) { await this.F.deleteDoc(this.ref(P + 'groups', id)); }
  watchQuizzes(cb, er) { return this.F.onSnapshot(this.col(P + 'quizzes'), s => cb(sortByCreated(s.docs.map(d => this._dt(d)))), er); }
  watchQuiz(id, cb, er) { return this.F.onSnapshot(this.ref(P + 'quizzes', id), s => cb(this._d(s)), er); }
  async getQuiz(id) { return this._d(await this.F.getDoc(this.ref(P + 'quizzes', id))); }
  async createQuiz(pub, key) { const r = this.F.doc(this.col(P + 'quizzes')); const b = this.F.writeBatch(this.db); b.set(r, this._v({ ...pub, createdAt: SERVER_TS })); b.set(this.ref(P + 'keys', r.id), { key }); await b.commit(); return r.id; }
  async updateQuiz(id, p) { await this.F.updateDoc(this.ref(P + 'quizzes', id), this._v(p)); }
  async deleteQuiz(id) { for (const sub of ['attempts', 'taken']) { const s = await this.F.getDocs(this.col(P + 'quizzes', id, sub)); for (const d of s.docs) await this.F.deleteDoc(d.ref); } await this.F.deleteDoc(this.ref(P + 'keys', id)); await this.F.deleteDoc(this.ref(P + 'quizzes', id)); }
  async getKey(id) { const s = await this.F.getDoc(this.ref(P + 'keys', id)); return s.exists() ? s.data().key : null; }
  async setKey(id, key) { await this.F.setDoc(this.ref(P + 'keys', id), { key }); }
  async findOpenQuizByPin(pin) { const F = this.F; const s = await F.getDocs(F.query(this.col(P + 'quizzes'), F.where('pin', '==', pin), F.where('status', '==', 'open'), F.limit(1))); return s.empty ? null : this._dt(s.docs[0]); }
  watchAttempts(qid, cb, er) { return this.F.onSnapshot(this.col(P + 'quizzes', qid, 'attempts'), s => cb(s.docs.map(d => this._dt(d))), er); }
  watchAttempt(qid, uid, cb, er) { return this.F.onSnapshot(this.ref(P + 'quizzes', qid, 'attempts', uid), s => cb(this._d(s)), er); }
  async getAttempt(qid, uid) { return this._d(await this.F.getDoc(this.ref(P + 'quizzes', qid, 'attempts', uid))); }
  async isTaken(qid, nk) { return (await this.F.getDoc(this.ref(P + 'quizzes', qid, 'taken', nk))).exists(); }
  watchTaken(qid, cb, er) { return this.F.onSnapshot(this.col(P + 'quizzes', qid, 'taken'), s => cb(s.docs.map(d => d.data())), er); }
  async startAttempt(qid, uid, data, nk) {
    const b = this.F.writeBatch(this.db);
    b.set(this.ref(P + 'quizzes', qid, 'taken', nk), { name: data.name, uid, at: this.F.serverTimestamp() });

const TYPE_LABEL = { mcq: 'اختيار من متعدد', tf: 'صح أو خطأ', match: 'تصنيف', text: 'كتابة تطبيقية' };
function resolveIndex(ans, options) {
  if (typeof ans === 'number') return Number.isInteger(ans) && ans >= 1 && ans <= options.length ? ans - 1 : -1;
  if (typeof ans === 'string') {
    const t = toLatin(ans).trim();
    if (/^\d+$/.test(t)) { const n = +t; return n >= 1 && n <= options.length ? n - 1 : -1; }
    return options.findIndex(o => String(o).trim() === ans.trim());
  }
  return -1;
}
function parseTF(v) {
  if (v === true || v === false) return v;
  const s = String(v ?? '').trim().toLowerCase();
  if (['true', 'صح', 'صحيح', 'صواب', '1', 'نعم'].includes(s)) return true;
  if (['false', 'خطأ', 'خطا', 'غلط', '0', 'لا'].includes(s)) return false;
  return null;
}
function compileQuestions(raw) {
  const src = Array.isArray(raw) ? { questions: raw } : (raw || {});
  const list = Array.isArray(src.questions) ? src.questions : [];
  const questions = [], key = {}, errors = [];
  if (!list.length) errors.push('لا توجد أسئلة في الملف (المفتاح questions).');
  list.forEach((q, n) => {
    const id = 'q' + (n + 1);
    const type = String(q.type || '').toLowerCase().trim();
    const text = String(q.text || '').trim();
    const where = `السؤال ${n + 1}: `;
    if (!text) errors.push(where + 'لا يوجد نص.');
    const pts = q.points != null && Number.isFinite(Number(q.points)) ? Math.max(0, Number(q.points)) : (type === 'match' ? 2 : type === 'text' ? 0 : 1);
    const ex = String(q.explanation || '').trim();
    if (type === 'mcq') {
      const opts = (q.options || []).map((t, i) => ({ id: 'o' + (i + 1), text: String(t) }));
      const ai = resolveIndex(q.answer, (q.options || []).map(String));
      if (opts.length < 2) errors.push(where + 'يحتاج خيارين على الأقل.');
      if (ai < 0) errors.push(where + 'رقم الإجابة الصحيحة غير صحيح (answer يبدأ من 1).');
      questions.push({ id, type, text, points: pts, options: opts });
      key[id] = { answer: 'o' + (ai + 1), explanation: ex };
    } else if (type === 'tf') {
      const a = parseTF(q.answer);
      if (a === null) errors.push(where + 'الإجابة يجب أن تكون true أو false.');
      questions.push({ id, type, text, points: pts });
      key[id] = { answer: a, explanation: ex };
    } else if (type === 'match') {
      const optsRaw = (q.options || []).map(String);
      const opts = optsRaw.map((t, i) => ({ id: 'o' + (i + 1), text: t }));
      const items = [], answers = {};
      (q.items || []).forEach((it, i) => {
        const iid = 'i' + (i + 1);
        const t = typeof it === 'string' ? it : String(it.text || '');
        const ai = resolveIndex(typeof it === 'string' ? null : it.answer, optsRaw);
        if (ai < 0) errors.push(where + `البند ${i + 1} بلا إجابة صحيحة.`);
        items.push({ id: iid, text: t }); answers[iid] = 'o' + (ai + 1);
      });
      if (opts.length < 2 || !items.length) errors.push(where + 'التصنيف يحتاج خيارات (options) وبنوداً (items).');
      questions.push({ id, type, text, points: pts, options: opts, items });
      key[id] = { answers, explanation: ex };
    } else if (type === 'text') {
      questions.push({ id, type, text, points: 0 });
      key[id] = { model: String(q.model || q.answer || '').trim(), explanation: ex };
    } else errors.push(where + `نوع غير معروف «${esc(q.type)}» (الأنواع: mcq, tf, match, text).`);
  });
  const autoTotal = questions.filter(x => x.type !== 'text').reduce((s, x) => s + x.points, 0);
  return { title: String(src.title || '').trim(), maxScore: Number(src.maxScore) || null, durationMin: src.durationMin != null ? Number(src.durationMin) : null, questions, key, autoTotal, errors };
}
function grade(quiz, key, answers) {
  let earned = 0, total = 0; const per = {};
  for (const x of quiz.questions || []) {
    const k = key?.[x.id]; if (!k || x.type === 'text') continue;
    const a = answers?.[x.id];

    if (x.type === 'mcq' || x.type === 'tf') { const ok = a === k.answer; per[x.id] = ok ? 1 : 0; if (ok) earned += x.points; }
    else if (x.type === 'match') { const n = (x.items || []).length; let c = 0; for (const it of x.items || []) if (a && a[it.id] && a[it.id] === k.answers?.[it.id]) c++; const fr = n ? c / n : 0; per[x.id] = Math.round(fr * 100) / 100; earned += x.points * fr; }

  const max = Number(quiz.maxScore) || 5;
  return { earned: Math.round(earned * 100) / 100, total, per, score: total ? round4(earned / total * max) : 0 };
}

const optText = (x, id) => (x.options || []).find(o => o.id === id)?.text ?? '—';

function rulesText(email) {

service cloud.firestore {
  match /databases/{database}/documents {

    // بريد حساب الأستاذ (يمكن إضافة أكثر من بريد بينها فاصلة)

    }

    function quizOf(qid) {
      return get(/databases/$(database)/documents/mrn_quizzes/$(qid)).data;
    }
    function platformOpen() {
      return !exists(/databases/$(database)/documents/mrn_settings/global)

    }

    }

let awaySince = null, lastPrint = 0;
const inQuiz = () => S.view === 'quiz' && !S.locked;
function goneAway() { if (!inQuiz() || awaySince) return; awaySince = Date.now(); document.body.classList.add('away'); }
function cameBack() {
  if (!awaySince) return;
  const ms = Date.now() - awaySince; awaySince = null; document.body.classList.remove('away');
  if (!inQuiz() || ms < 800) return;
  S.counters.leave = (S.counters.leave || 0) + 1;
  S.counters.awayMs = (S.counters.awayMs || 0) + ms;
  logEvent('leave', Math.round(ms / 1000), false);
  toast(`سُجّل خروجك من الصفحة (${secs(ms)})`, 'warn', 3500);
}
function onPrintKey() {
  if (!inQuiz() || Date.now() - lastPrint < 1500) return;
  lastPrint = Date.now(); logEvent('print');
  try { navigator.clipboard?.writeText(' ').catch(() => {}); } catch (e) {}
  const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
  toast('لقطة الشاشة غير مسموحة وقد سُجّلت', 'danger', 3500);
}
document.addEventListener('visibilitychange', () => document.hidden ? goneAway() : cameBack());
addEventListener('blur', goneAway);
addEventListener('focus', cameBack);
addEventListener('pagehide', goneAway);
document.addEventListener('paste', e => { if (!inQuiz()) return; e.preventDefault(); logEvent('paste'); toast('اللصق غير مسموح، وسُجّلت المحاولة', 'danger'); }, true);
document.addEventListener('copy', e => { if (!inQuiz()) return; e.preventDefault(); logEvent('copy'); toast('النسخ غير مسموح', 'danger'); }, true);

document.addEventListener('dragstart', e => { if (inQuiz()) e.preventDefault(); }, true);
document.addEventListener('contextmenu', e => { if (!inQuiz()) return; e.preventDefault(); logEvent('menu'); }, true);
document.addEventListener('selectstart', e => { if (!inQuiz()) return; const t = e.target.nodeType === 3 ? e.target.parentElement : e.target; if (!t?.closest?.('textarea')) e.preventDefault(); }, true);
document.addEventListener('beforeinput', e => {
  if (!inQuiz()) return;

  if (e.data && e.data.length > BULK_LIMIT && /^insert/.test(t)) { e.preventDefault(); logEvent('bulk', e.data.length); toast('إدخال نص كبير دفعة واحدة غير مسموح', 'danger'); }
}, true);
document.addEventListener('keydown', e => {

function parseNamesText(t) { return [...new Set(String(t || '').split(/\r?\n/).map(cleanName).filter(n => n.length >= 3))]; }
function cleanName(s) { return String(s ?? '').replace(/^\s*[\d٠-٩]+\s*[-–.)\]:]?\s+/, '').replace(/["']/g, '').replace(/\s+/g, ' ').trim(); }
function pickNameColumn(rows) {
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim()));
  if (!rows.length) return [];
  const width = Math.max(...rows.map(r => r.length));
  const head = rows[0].map(c => String(c ?? '').trim());
  let col = head.findIndex(h => /اسم|الاسم|name/i.test(h) && !/رقم|id|هوية|سجل/i.test(h));
  let start = col >= 0 ? 1 : 0;
  if (col < 0) {
    let best = 0, bestN = -1;
    for (let c = 0; c < width; c++) { const n = rows.filter(r => /[؀-ۿ]{2,}\s+[؀-ۿ]{2,}/.test(String(r[c] ?? ''))).length; if (n > bestN) { bestN = n; best = c; } }
    col = best; if (/اسم|طالب|name/i.test(String(rows[0][col] ?? ''))) start = 1;
  }
  return [...new Set(rows.slice(start).map(r => cleanName(r[col])).filter(n => n.length >= 3 && /[؀-ۿa-zA-Z]/.test(n)))];
}
async function namesFromFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (['xlsx', 'xls', 'ods'].includes(ext)) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', 'XLSX');
    const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return pickNameColumn(window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }));
  }
  const text = await file.text();
  return pickNameColumn(text.split(/\r?\n/).map(l => l.split(/[,;\t]/)));
}

async function autoGrade(force = false) {
  const M = S.mon; if (!M || !M.quiz || !M.key || M.grading) return;
  const q = M.quiz;
  const writes = [];
  for (const a of M.atts) {
    if (!(a.status === 'submitted' || q.status === 'closed')) continue;
    const g = grade(q, M.key, a.answers);
    if (force || a.score !== g.score || a.auto?.earned !== g.earned || a.auto?.total !== g.total) writes.push([a.id, { score: g.score, auto: { earned: g.earned, total: g.total, per: g.per }, gradedAt: SERVER_TS }]);
  }
  if (!writes.length) return;
  M.grading = true;
  try { for (const [id, p] of writes) await S.db.teacherUpdateAttempt(q.id, id, p); }
  catch (e) { toast(errMsg(e), 'danger'); }
  finally { if (S.mon === M) M.grading = false; }
}

    <label class="check"><input type="checkbox" id="rpQ" checked><span>تضمين الأسئلة والإجابات الصحيحة</span></label>
    <label class="check"><input type="checkbox" id="rpAbs" checked><span>تضمين من لم يشارك</span></label>
    <label class="check"><input type="checkbox" id="rpInt"><span>تضمين مؤشرات النزاهة <small class="muted">(للأستاذ فقط، لا تشاركه مع الطلاب)</small></span></label>
    <div class="actions"><button class="btn ghost" data-close>إلغاء</button><button class="btn pri" id="rpGo">إنشاء التقرير</button></div>`);
  $('#rpGo', m).onclick = async () => {
    const opts = { questions: $('#rpQ', m).checked, absent: $('#rpAbs', m).checked, integrity: $('#rpInt', m).checked };
    closeModal(); await autoGrade(); buildReport(opts);
  };
}
function buildReport(opts) {
  const M = S.mon, q = M.quiz, key = M.key || {};
  let rows = reportRows(q, M.atts);
  if (!opts.absent) rows = rows.filter(r => r.a);
  const fin = rows.filter(r => r.score != null).map(r => r.score);
  const avg = fin.length ? fin.reduce((s, v) => s + v, 0) / fin.length : null;
  const now = Date.now();
  const flagsTxt = a => { if (!a) return ''; const c = a.counters || {}; const p = []; if (c.paste || c.drop || c.bulk) p.push('لصق ' + ((c.paste || 0) + (c.drop || 0) + (c.bulk || 0))); if (c.leave) p.push(`خروج ${c.leave} (${secs(c.awayMs)})`); if (c.print) p.push('لقطة شاشة ' + c.print); if (c.copy || c.cut) p.push('نسخ ' + ((c.copy || 0) + (c.cut || 0))); return p.join('، ') || '—'; };
  $('#print-root').innerHTML = `<div class="rp-tool"><button class="btn pri" id="rpPrint">طباعة / حفظ PDF</button><button class="btn" id="rpClose">إغلاق</button></div>
  <div class="rp">
    <div class="rp-brand">${APP.name} — ${APP.tagline}</div>
    <h1>${esc(q.title)}</h1>
    <div class="rp-meta">${esc(q.groupName || '')}${q.groupName ? ' · ' : ''}${dayHijri(now)} (${dayGreg(now)}) · الدرجة الكلية: ${fmtNum(q.maxScore)}</div>
    <div class="rp-stats"><span>المشاركون: <b>${M.atts.length}</b></span><span>المتوسط: <b>${avg != null ? fmtNum(avg) : '—'}</b></span><span>الأعلى: <b>${fin.length ? fmtNum(Math.max(...fin)) : '—'}</b></span><span>الأدنى: <b>${fin.length ? fmtNum(Math.min(...fin)) : '—'}</b></span></div>
    <h2>الدرجات</h2>
    <table><thead><tr><th class="num">م</th><th>الاسم</th><th class="num">الدرجة من ${fmtNum(q.maxScore)}</th><th>الحالة</th>${opts.integrity ? '<th>مؤشرات النزاهة</th>' : ''}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td class="num">${i + 1}</td><td>${esc(r.name)}</td><td class="num"><b>${r.score != null ? fmtNum(r.score) : '—'}</b></td><td>${r.status}</td>${opts.integrity ? `<td>${flagsTxt(r.a)}</td>` : ''}</tr>`).join('')}</tbody></table>
    ${opts.questions ? `<h2>الأسئلة والإجابات الصحيحة</h2>${keyHTML(q, key, true)}` : ''}
    <div class="rp-foot">أُعدّ بمنصة ${APP.name} · تطوير: ${esc(APP.dev)}</div>
  </div>`;
  document.body.classList.add('printing'); scrollTo(0, 0);
  $('#rpPrint').onclick = () => window.print();
  $('#rpClose').onclick = () => { document.body.classList.remove('printing'); $('#print-root').innerHTML = ''; };
  setTimeout(() => window.print(), 400);
}
function exportCSV() {
  const M = S.mon, q = M.quiz;
  const head = ['م', 'الاسم', 'الحالة', 'الدرجة', 'من', 'البدء', 'التسليم', 'المدة (دقيقة)', 'محاولات لصق', 'مرات الخروج', 'مدة الخروج (ثانية)', 'لقطة شاشة', 'محاولات نسخ', 'الجهاز'];
  const rows = reportRows(q, M.atts).map((r, i) => { const a = r.a, c = a?.counters || {}, d = a ? attDuration(a) : null; return [i + 1, r.name, r.status, r.score ?? '', q.maxScore, a ? clock(toMs(a.startedAt)) : '', a ? clock(toMs(a.submittedAt)) : '', d != null ? Math.round(d / 6000) / 10 : '', a ? (c.paste || 0) + (c.drop || 0) + (c.bulk || 0) : '', a ? c.leave || 0 : '', a ? Math.round((c.awayMs || 0) / 1000) : '', a ? c.print || 0 : '', a ? (c.copy || 0) + (c.cut || 0) : '', a?.device || '']; });
  const csv = '﻿' + [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(csv, `${q.title} - ${q.groupName || 'درجات'}.csv`.replace(/[\\/:*?"<>|]/g, '-'), 'text/csv;charset=utf-8');
}
function projector() {
  const q = S.mon?.quiz; if (!q) return;
  const link = studentLink();
  const root = $('#modal-root');
  root.innerHTML = `<div class="proj"><button class="btn proj-x" data-close>إغلاق ✕</button>
    <div class="brand"><div class="logo">م</div><div style="text-align:start"><b>${APP.name}</b><small>${APP.tagline}</small></div></div>
    <div class="proj-title">${esc(q.title)}</div>
    <div class="proj-grid"><div class="proj-qr" id="projQR"></div>
      <div class="proj-steps"><div>١) امسح الرمز بكاميرا الجوال</div><div>٢) أدخل رمز الدخول:</div><div class="proj-pin">${esc(q.pin)}</div><div>٣) اختر اسمك وابدأ</div></div></div>
    <div class="proj-link">${esc(link)}</div>
    <button class="btn sm ghost" id="fsBtn">ملء الشاشة</button></div>`;
  root.querySelector('[data-close]').onclick = () => { if (document.fullscreenElement) document.exitFullscreen?.(); root.innerHTML = ''; };
  $('#fsBtn').onclick = () => root.firstElementChild.requestFullscreen?.();
  renderQR($('#projQR'), link, Math.min(340, Math.round(innerWidth * .38)));
}

/* =========================================================
   الأحداث العامة (النقر)
   ========================================================= */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  const findQ = () => S.adm.quizzes.find(q => q.id === id) || (S.mon?.quiz?.id === id ? S.mon.quiz : null);
  switch (act) {
    // الطالب
    case 'pin-go': return enterPin($('#pin')?.value || '');
    case 'mine': return openMine(b.dataset.q);
    case 'back-landing': return renderLanding();
    case 'name': S.selName = b.dataset.name; $('#startBtn') && ($('#startBtn').disabled = false); S.drawNames && S.drawNames(); return;
    case 'start': return startQuiz();
    case 'pick': if (!inQuiz()) return; S.answers[b.dataset.q] = b.dataset.v; return changed(b.dataset.q);
    case 'tf': if (!inQuiz()) return; S.answers[b.dataset.q] = b.dataset.v === 'true'; return changed(b.dataset.q);
    case 'match': if (!inQuiz()) return; { const cur = { ...(S.answers[b.dataset.q] || {}) }; cur[b.dataset.i] = b.dataset.v; S.answers[b.dataset.q] = cur; } return changed(b.dataset.q);
    case 'submit': return submitFlow(false);
    // عام
    case 'teacher': location.hash = 'admin'; return;
    case 'student-page': location.hash = ''; if (!location.hash) location.reload(); return;
    case 'try-demo': lsSet('mrn_demo', 1); location.reload(); return;
    case 'exit-demo': lsDel('mrn_demo'); location.reload(); return;
    case 'save-cfg': { const c = parseConfigText($('#cfgText')?.value); if (!c) return toast('لم أجد apiKey و projectId في النص الملصوق', 'danger', 5000); lsSet('mrn_cfg', c); lsDel('mrn_demo'); toast('حُفظت الإعدادات', 'ok'); setTimeout(() => location.reload(), 500); return; }
    case 'clear-cfg': if (await confirmBox('مسح إعدادات الاتصال', 'ستُمسح إعدادات فايربيز من هذا المتصفح فقط، ولا يُحذف شيء من قاعدة البيانات.', 'مسح', true)) { lsDel('mrn_cfg'); location.reload(); } return;
    case 'copy': { const el = $(b.dataset.sel); if (el) copyText(el.value ?? el.textContent); return; }
    case 'dl-template': return download(JSON.stringify(TEMPLATE, null, 2), 'نموذج-ملف-أسئلة.json', 'application/json');
    // الأستاذ
    case 'login': return doLogin();
    case 'logout': await busy(() => S.db.teacherLogout()); return;
    case 'tab': S.adm.tab = b.dataset.tab; S.adm.view = 'home'; stopMonitor(); return renderAdmin();
    case 'platform': return setPlatform(b.dataset.open === '1');
    case 'seed-demo': return seedDemo();
    case 'new-quiz': if (!S.adm.groups.length && !(await confirmBox('لا توجد مواد بعد', 'يمكنك إنشاء نموذج بلا قائمة أسماء (يكتب الطالب اسمه)، أو إضافة مادة وأسماء طلابها أولاً من تبويب «المواد والطلاب».', 'متابعة بلا قائمة'))) return; return quizModal(null);
    case 'edit-quiz': { const q = findQ(); if (q) quizModal(q); return; }
    case 'open-quiz': { const q = findQ(); if (q) setQuizOpen(q, true); return; }
    case 'close-quiz': { const q = findQ(); if (q) setQuizOpen(q, false); return; }
    case 'copy-quiz': { const q = findQ(); if (q) copyQuiz(q); return; }
    case 'del-quiz': { const q = findQ(); if (q && await confirmBox('حذف النموذج', `سيُحذف «${esc(q.title)}» مع كل الإجابات والدرجات نهائياً.`, 'حذف نهائي', true)) busy(async () => { await S.db.deleteQuiz(q.id); toast('حُذف النموذج', 'ok'); }); return; }
    case 'monitor': return openMonitor(id);
    case 'mon-back': stopMonitor(); S.adm.view = 'home'; return renderAdmin();
    case 'new-course': return courseModal(null);
    case 'edit-course': { const g = S.adm.groups.find(x => x.id === id); if (g) courseModal(g); return; }
    case 'course-close': { const g = S.adm.groups.find(x => x.id === id); if (g) setCourseClosed(g, b.dataset.closed === '1'); return; }
    case 'del-course': { const g = S.adm.groups.find(x => x.id === id); if (g && await confirmBox('حذف المادة', `ستُحذف «${esc(g.name)}» وقائمة أسمائها. النماذج المرتبطة بها تبقى بنتائجها.`, 'حذف', true)) busy(async () => { await S.db.deleteGroup(g.id); toast('حُذفت المادة', 'ok'); }); return; }
    case 'toggle': return toggleQuizFlag(b.dataset.k);
    case 'toggle-absent': if (S.mon) { S.mon.showAbsent = !S.mon.showAbsent; renderMonitor(); } return;
    case 'proj': return projector();
    case 'report': return reportModal();
    case 'csv': return exportCSV();
    case 'key-view': { const M = S.mon; if (M?.quiz) modal(`<h3>الأسئلة والإجابات الصحيحة</h3>${keyHTML(M.quiz, M.key || {})}<div class="actions"><button class="btn" data-close>إغلاق</button></div>`, { wide: true }); return; }
    case 'att': { const a = S.mon?.atts.find(x => x.id === id); if (a) attemptModal(a); return; }
  }
});

boot();
</script>
